<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Витрина смартфонов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
         font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg2); padding: 12px 12px 8px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  #q { width: 100%; padding: 10px 12px; border-radius: 10px; border: none; background: var(--bg);
       color: var(--text); font-size: 15px; outline: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 16px; background: var(--bg); color: var(--text);
          border: none; font-size: 14px; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px;
         padding: 4px 12px 110px; }
  .card { background: var(--bg); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; }
  .img { aspect-ratio: 1; border-radius: 10px; background: var(--bg2) center/contain no-repeat;
         display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 8px; }
  .name { font-weight: 600; font-size: 14px; }
  .sub { color: var(--hint); font-size: 13px; margin: 2px 0 6px; }
  .price { font-weight: 700; margin-top: auto; }
  .stock { color: var(--hint); font-size: 12px; }
  .add { margin-top: 8px; border: none; border-radius: 10px; padding: 8px; background: var(--accent);
         color: var(--accent-text); font-size: 14px; font-weight: 600; }
  .qty { margin-top: 8px; display: flex; align-items: center; justify-content: space-between;
         background: var(--bg2); border-radius: 10px; }
  .qty button { border: none; background: none; color: var(--accent); font-size: 20px; width: 40px; height: 34px; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--hint); padding: 40px 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px; background: var(--bg);
         box-shadow: 0 -2px 10px rgba(0,0,0,.08); display: none; }
  #bar .sum { font-size: 14px; margin-bottom: 8px; }
  #go { width: 100%; border: none; border-radius: 12px; padding: 13px; background: var(--accent);
        color: var(--accent-text); font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="shop">Смартфоны</h1>
  <input id="q" placeholder="Поиск: модель, память, цвет…" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<main id="list"><div class="empty">Загрузка…</div></main>
<div id="bar"><div class="sum" id="sum"></div><button id="go">Оформить заказ</button></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let CUR = 'сум', PREORDER = false;
const fmt = n => Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ' + CUR;
const maxQty = i => i.qty > 0 ? i.qty : (PREORDER ? 10 : 0);
let items = [], brand = '', query = '';
const cart = {};

function b64urlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function loadData() {
  const z = new URLSearchParams(location.search).get('z');
  if (!z) throw new Error('нет данных каталога — откройте витрину кнопкой в боте');
  const stream = new Blob([b64urlToBytes(z)]).stream().pipeThrough(new DecompressionStream('deflate'));
  return JSON.parse(await new Response(stream).text());
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderChips() {
  const brands = [...new Set(items.map(i => i.brand))].sort();
  const el = document.getElementById('chips');
  el.innerHTML = ['Все', ...brands].map(b =>
    `<button class="chip ${(b === 'Все' ? '' : b) === brand ? 'on' : ''}" data-b="${esc(b === 'Все' ? '' : b)}">${esc(b)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { brand = c.dataset.b; renderChips(); render(); });
}

function render() {
  const q = query.toLowerCase();
  const list = items.filter(i => (!brand || i.brand === brand) &&
    (!q || [i.brand, i.model, i.mem, i.color].join(' ').toLowerCase().includes(q)));
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">Ничего не найдено</div>'; return renderBar(); }
  el.innerHTML = list.map(i => {
    const n = cart[i.id] || 0;
    const img = i.img ? `style="background-image:url('${esc(i.img)}')"` : '';
    const ctl = n
      ? `<div class="qty"><button data-a="-" data-id="${i.id}">−</button><b>${n}</b><button data-a="+" data-id="${i.id}">+</button></div>`
      : `<button class="add" data-a="+" data-id="${i.id}">В корзину</button>`;
    return `<div class="card"><div class="img" ${img}>${i.img ? '' : '📱'}</div>
      <div class="name">${esc(i.brand)} ${esc(i.model)}</div>
      <div class="sub">${esc([i.mem, i.color].filter(Boolean).join(' · '))}</div>
      <div class="price">${fmt(i.price)}</div><div class="stock">${i.qty > 0 ? 'в наличии ' + i.qty + ' шт.' : 'под заказ'}</div>${ctl}</div>`;
  }).join('');
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const id = +b.dataset.id, it = items.find(x => x.id === id);
    const n = (cart[id] || 0) + (b.dataset.a === '+' ? 1 : -1);
    if (n > maxQty(it)) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('warning'); return; }
    if (n <= 0) delete cart[id]; else cart[id] = n;
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
    render();
  });
  renderBar();
}

function renderBar() {
  const ids = Object.keys(cart);
  const cnt = ids.reduce((s, id) => s + cart[id], 0);
  const total = ids.reduce((s, id) => s + cart[id] * items.find(x => x.id === +id).price, 0);
  document.getElementById('bar').style.display = cnt ? 'block' : 'none';
  document.getElementById('sum').textContent = `В корзине ${cnt} шт. · ${fmt(total)}`;
}

document.getElementById('q').oninput = e => { query = e.target.value.trim(); render(); };
document.getElementById('go').onclick = () => {
  const payload = JSON.stringify({ items: Object.keys(cart).map(id => [+id, cart[id]]) });
  if (tg && tg.sendData) tg.sendData(payload);   // бот получит web_app_data и закроет витрину
  else alert('Откройте витрину из Telegram-бота');
};

loadData().then(d => {
  CUR = d.c || 'сум'; PREORDER = !!d.o;
  document.getElementById('shop').textContent = d.s || 'Смартфоны';
  document.title = d.s || document.title;
  items = (d.p || []).map(r => ({ id: r[0], brand: r[1], model: r[2], mem: r[3], color: r[4],
                                  price: r[5], qty: r[6], img: r[7] }));
  renderChips(); render();
}).catch(e => {
  document.getElementById('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
});
</script>
</body>
</html>
